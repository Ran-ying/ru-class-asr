name: Node checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: bash -n scripts/mac-whisper-models.sh scripts/mac-local-translate.sh scripts/mac-classroom.sh
      - run: python3 -m unittest discover -s tests/python -p 'test_*.py'
